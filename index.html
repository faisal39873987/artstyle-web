<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Art Style Apps product portal for mobile apps, release status, team planning, and visitor suggestions."
    />
    <title>Art Style Apps</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="/assets/site/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" data-link>
          <span class="brand-mark">AS</span>
          <span class="brand-copy">
            <strong>Art Style Apps</strong>
            <small>Product Library</small>
          </span>
        </a>
        <nav class="nav">
          <a href="/" data-link>Apps</a>
          <a href="/team" data-link>Team</a>
          <a href="/plan" data-link>Plan</a>
          <a href="/backend" data-link>Backend</a>
        </nav>
        <div class="auth-actions">
          <button class="icon-button" type="button" data-auth="google" title="Continue with Google" aria-label="Continue with Google">G</button>
          <button class="icon-button" type="button" data-auth="apple" title="Continue with Apple" aria-label="Continue with Apple">A</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
    <script type="module" src="/assets/site/portal.js"></script>
  </body>
</html>
